[tox]
env_list = build-docs

[testenv:build-docs]
description = build the documentation
deps =
  -r{toxinidir}/docs/requirements.txt
commands =
  # Build the html docs with Sphinx:
  {envpython} -m sphinx \
    -j auto \
    -b html \
    {tty:--color} \
    -a \
    -n -W --keep-going \
    -d "{temp_dir}/.doctrees" \
    . \
    {posargs:{envdir}/docs_out}
changedir = {toxinidir}/docs
passenv =
  READTHEDOCS
  READTHEDOCS_VERSION_TYPE
# docs/conf.py reads the version from aiofastnet/_version.py, so the
# extension modules don't need to be built for the docs.
skip_install = true

[testenv:pip-compile-docs]
description = compile requirements for the documentation
deps =
  uv
commands =
  uv pip compile \
    --universal \
    --python-version 3.13 \
    --custom-compile-command "tox run -e pip-compile-docs" \
    --quiet \
    docs/requirements.in \
    -o docs/requirements.txt \
    {posargs}
skip_install = true
